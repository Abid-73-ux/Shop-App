workflows:
  default-workflow:
    name: Build Flutter APK
    environment:
      flutter: stable
      xcode: latest
      java: 11
    triggering:
      events:
        - push
        - tag
      branch:
        include:
          - main
    scripts:
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
